<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- הספרייה עוד לא פתוחה לציבור. כשחי מחליט לפתוח: למחוק את השורה הבאה ולקשר מהביו. -->
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F4F2EA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121611" media="(prefers-color-scheme: dark)">
<link rel="icon" href="admin/icon.svg" type="image/svg+xml">
<title>כלים · חי אליאסי</title>
<meta name="description" content="מחשבונים ומדריכים לניהול הכסף בבית, לזוגות צעירים ולמשפחות.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="shared/style.css">
<style>
  .tools{display:grid;gap:12px;margin-top:24px}
  .tool{display:flex;align-items:center;gap:16px;padding:16px;color:var(--ink);text-decoration:none;transition:border-color var(--t),background var(--t)}
  .tool:active{background:var(--surface-2)}
  @media (hover:hover){.tool:hover{border-color:var(--sage)}}
  .tool .main{flex:1;min-width:0}
  .tool small{display:block;font-size:.78rem;font-weight:600;color:var(--accent);letter-spacing:.02em}
  .tool h2{font-size:1.1rem;font-weight:600;margin-top:2px}
  .tool p{color:var(--ink-2);font-size:.92rem;margin-top:4px}
  .tool .arrow{flex:none;width:8px;height:8px;border:solid var(--ink-3);border-width:0 0 1.75px 1.75px;transform:rotate(45deg);margin-inline-end:4px}
  .soon{color:var(--ink-2);text-align:center;padding:24px 0}
</style>
</head>
<body>

<header class="mast page">
  <div class="logo" aria-hidden="true"><img src="shared/mark.svg" alt="" width="27" height="18"></div>
  <div class="name"><b>חי אליאסי</b><span>יועץ פיננסי לזוגות צעירים ולמשפחות</span></div>
</header>

<section class="hero page">
  <span class="eyebrow">כלים</span>
  <h1>כלים לסדר בכסף של הבית</h1>
  <p>מחשבונים ומדריכים קצרים. בלי הרשמה, בחינם.</p>
</section>

<main class="page">
  <div class="tools" id="tools"><div class="spinner"></div></div>
</main>

<footer class="page">
  <p>האמור באתר לא מהווה ייעוץ. <a href="privacy.html">מדיניות פרטיות</a> · <a href="accessibility.html">הצהרת נגישות</a></p>
</footer>

<script>
(function () {
  const box = document.getElementById('tools');
  // only tools marked <meta name="tool:public" content="true">
  fetch('catalog.json', { cache: 'no-store' }).then(r => r.json()).then(c => {
    const tools = c.tools.filter(t => t.public);
    box.textContent = '';
    if (!tools.length) { box.innerHTML = '<p class="soon">בקרוב.</p>'; return; }
    tools.forEach(t => {
      const a = document.createElement('a');
      a.className = 'card tool';
      a.href = t.path;
      a.innerHTML = '<div class="main"><small></small><h2></h2><p></p></div><span class="arrow" aria-hidden="true"></span>';
      a.querySelector('small').textContent = t.type;
      a.querySelector('h2').textContent = t.title;
      a.querySelector('p').textContent = t.description;
      box.append(a);
    });
  }).catch(() => { box.innerHTML = '<p class="soon">משהו השתבש בטעינה. נסו לרענן.</p>'; });
})();
</script>
</body>
</html>
